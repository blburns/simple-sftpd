# CI: build, test, Docker, and optional static analysis
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libjsoncpp-dev pkg-config

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DENABLE_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: (cd build && ctest --output-on-failure -C ${{ env.BUILD_TYPE }})

  build-macos:
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake openssl jsoncpp pkg-config

      - name: Configure
        run: |
          export OPENSSL_ROOT_DIR=$(brew --prefix openssl)
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DENABLE_TESTS=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu))

      - name: Test
        run: (cd build && ctest --output-on-failure -C ${{ env.BUILD_TYPE }})

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DENABLE_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Test
        run: (cd build && ctest -C ${{ env.BUILD_TYPE }} --output-on-failure)

  docker-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t simple-sftpd:ci -f Dockerfile .

      - name: Docker run smoke
        run: |
          docker run -d -p 2121:21 --name sftpd simple-sftpd:ci
          sleep 3
          docker exec sftpd nc -z localhost 21 || (docker logs sftpd; exit 1)
          docker stop sftpd && docker rm sftpd

  static-analysis:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev libjsoncpp-dev pkg-config clang-tidy

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Build (clang-tidy)
        run: cmake --build build -j$(nproc) 2>&1 | head -200

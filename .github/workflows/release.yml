# Release: build packages and optionally create a GitHub release.
# Trigger: push tag v* (e.g. v0.2.0) or manually.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-packages:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: deb
          - os: macos-12
            artifact: pkg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        run: |
          v="${GITHUB_REF#refs/tags/v}"
          echo "version=$v" >> $GITHUB_OUTPUT

      - name: Install deps (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev libjsoncpp-dev pkg-config

      - name: Install deps (macOS)
        if: matrix.os == 'macos-12'
        run: brew install cmake openssl jsoncpp pkg-config

      - name: Configure
        run: |
          if [ "${{ matrix.os }}" = "macos-12" ]; then
            export OPENSSL_ROOT_DIR=$(brew --prefix openssl)
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_PACKAGING=ON

      - name: Build and package
        run: cmake --build build --target package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            build/*.deb
            build/*.rpm
            build/*.pkg
            build/*.dmg
          if-no-files-found: ignore

  create-release:
    needs: build-packages
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

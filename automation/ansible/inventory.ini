# Canonical inventory: SimpleDaemons/automation/build/inventory.ini
[build-vms]
# VMware Fusion VMs for building simple-sftpd
# Update IP addresses to match your VMware VMs
BUILD_DEB ansible_host=192.168.1.101 ansible_user=build ansible_ssh_private_key_file=~/.ssh/id_rsa
BUILD_RPM ansible_host=192.168.1.102 ansible_user=build ansible_ssh_private_key_file=~/.ssh/id_rsa
# macOS: use shared Homebrew (see automation/ansible/scripts/setup-macos-homebrew-shared.sh)
# Optional: run brew as the install owner instead of fixing group perms:
#   homebrew_run_as=admin
BUILD_MACOS ansible_host=127.0.0.1 ansible_user=build ansible_ssh_private_key_file=~/.ssh/id_rsa

[build-vms:vars]
# Variables for build VMs
ansible_python_interpreter=/usr/bin/python3
# homebrew_run_as=admin   # macOS only: sudo -u this user for brew update/install

[all:vars]
# Global variables
ansible_python_interpreter=/usr/bin/python3
git_repo_url=https://github.com/simpledaemons/simple-sftpd.git
git_branch=main

